<VirtualHost *:8080>

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # 🔥 THIS IS THE IMPORTANT PART
    Alias /portal /var/www/html/portal

    <Directory /var/www/html/portal>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>