<VirtualHost *:8080>

    ServerName localhost:8080
    UseCanonicalName On
    UseCanonicalPhysicalPort Off

    DocumentRoot /var/www/html

    # RedirectMatch ^/$ /
    # RedirectMatch ^/login$ /login
    # RedirectMatch ^/home$ /

    <Directory /var/www/html>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Alias /portal /var/www/html/portal

    <Directory /var/www/html/>
        Options +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/rest/v1>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>