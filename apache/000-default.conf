<VirtualHost *:8080>

    ServerName demo-app-viter-graces-mm4fb.ondigitalocean.app
    ServerPort 443
    UseCanonicalName On

    DocumentRoot /var/www/html

    RedirectMatch ^/$ /portal/
    RedirectMatch ^/login$ /portal/login
    RedirectMatch ^/home$ /portal/

    <Directory /var/www/html>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /portal /var/www/html/portal

    <Directory /var/www/html/portal>
        Options +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/rest>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>