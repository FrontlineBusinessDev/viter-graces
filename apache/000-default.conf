<VirtualHost *:8080>

    ServerName localhost
    UseCanonicalName Off

    DocumentRoot /var/www/html

    # Root redirect — done at VirtualHost level, not .htaccess
    RedirectMatch ^/$ /portal/

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/portal>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>