<VirtualHost *:80>

    ServerName localhost:80
    UseCanonicalName On
    UseCanonicalPhysicalPort Off

    DocumentRoot /var/www/html

    PassEnv APP_ENV

    ErrorLog "/proc/self/fd/2"
    CustomLog "/proc/self/fd/1" combined

    # RedirectMatch ^/$ /
    # RedirectMatch ^/login$ /login
    # RedirectMatch ^/home$ /

    <Directory /var/www/html>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Alias /portal /var/www/html/portal

    <Directory /var/www/html/>
        Options +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/rest/v1>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>